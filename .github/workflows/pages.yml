name: Website

# The website at https://sixgree.com/, built by scripts/build-site.mjs from
# site/ (see site/README.md) and published with GitHub Pages. The build has no
# dependencies: it fills the home page's generated parts, renders /download/,
# /docs/, /roadmap/, /about/, /releases/ and the blog, writes the feeds and the
# sitemap, and copies in the README's screenshots and the app icon. News and
# numbers come from CHANGELOG.md, tests/ and public/demo-data.json at build time,
# so the live site is never older than the changelog.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/img/**'
      - 'desktop/icon/**'
      - '.github/workflows/pages.yml'
      # What the build reads (scripts/build-site.mjs and the modules beside it).
      - 'CHANGELOG.md'
      - 'scripts/build-site.mjs'
      - 'scripts/site-news.mjs'
      - 'scripts/site-markdown.mjs'
      - 'tests/*.test.mjs'
      - 'public/demo-data.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ImageMagick makes the 1200px copies of the screenshots, for phones.
      - name: Build the site
        run: |
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          node scripts/build-site.mjs _site
          ls -la _site _site/img
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
