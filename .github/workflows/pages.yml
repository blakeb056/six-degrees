name: Website

# The website at https://sixdegreesapp.com/ — site/ plus the README's screenshots
# and the app icon, published with GitHub Pages. No dependencies. One step writes
# into the published copy: scripts/build-site-news.mjs fills the News section, the
# numbers strip and the sample-network charts from CHANGELOG.md, tests/ and
# public/demo-data.json, so the live site's news is never older than the changelog.
# Everything else in site/ is served as it is.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/img/**'
      - 'desktop/icon/**'
      - '.github/workflows/pages.yml'
      # What the generated parts are counted from (scripts/build-site-news.mjs).
      - 'CHANGELOG.md'
      - 'scripts/build-site-news.mjs'
      - 'tests/*.test.mjs'
      - 'public/demo-data.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp -R site/. _site/
          cp docs/img/app-window.png docs/img/degrees.png docs/img/paths.png _site/img/
          cp desktop/icon/icon.svg _site/img/icon.svg
          # 1200px copies for phones and small screens (the originals are 2880–3136px).
          command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          for f in app-window degrees paths; do convert "_site/img/$f.png" -resize 1200x "_site/img/$f-1200.png"; done
          ls -la _site _site/img
      # News, the numbers and the sample charts, from the files they're counted
      # from. Only the copy being published changes; site/index.html in the repo
      # keeps whatever was last committed (run the script locally to refresh it).
      - name: News and numbers
        run: node scripts/build-site-news.mjs _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
