name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if credentials or real network data are committed
        run: |
          set -e
          fail=0
          # Built from fragments so this workflow does not match itself.
          JWT_PREFIX="eyJhbGciOi""JIUzI1NiIs"
          if grep -rIn --exclude-dir=.git -F "$JWT_PREFIX" .; then
            echo "::error::A JWT was found in the tree."; fail=1
          fi
          for path in public/avatars scripts/connections-raw.txt; do
            if [ -e "$path" ]; then
              echo "::error::$path must never be committed — it contains real people."; fail=1
            fi
          done
          # demo-data.json is allowed ONLY while it is the generated sample.
          # Anything else in that path is somebody's real exported network.
          if [ -e public/demo-data.json ]; then
            if ! grep -q '"synthetic":true' public/demo-data.json; then
              echo "::error::public/demo-data.json is not the synthetic sample. Regenerate it with: npm run gen:demo"
              fail=1
            fi
          fi
          exit $fail
