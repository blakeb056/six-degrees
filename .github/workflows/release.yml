name: Release

# Push a tag like v0.2.0 and this builds the Mac app for both chips, publishes
# the .dmg files with a SHA256SUMS checksum file on a GitHub Release, then builds
# the npm package on Linux, checks it installs and serves the app
# (npm-package.yml), and publishes that exact tarball to npm.
#
# npm publishing uses npm's trusted publishing: npm is set up (package Settings →
# Trusted Publisher) to accept blakeb056/six-degrees's release.yml, and GitHub
# vouches for this run with a short-lived token. No npm token is stored anywhere.
# Renaming this file breaks that link; update it on npmjs.com if you do.
#
# install.sh downloads from the Release this creates, so nothing reaches users
# until a tag is pushed. Cutting one:
#
#   npm version 0.2.0 --no-git-tag-version   # bump package.json
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# Testing the packaging without publishing anything — do this before tagging
# whenever scripts/build-app.mjs or this file changed:
#
#   gh workflow run release.yml --ref <branch> -f dry_run=true
#
# A dry run builds both .dmg files on GitHub's Macs and keeps them as workflow
# artifacts. No tag, no Release, no npm.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v0.2.0 (leave empty for a dry run)'
        required: false
      dry_run:
        description: 'Build the .dmg files only and publish nothing'
        type: boolean
        default: false
      shell:
        description: 'Which Mac app: auto (electron, the main app since 0.2.0), electron, or classic (the pre-0.2 launcher, kept as a fallback)'
        type: choice
        options: [auto, electron, classic]
        default: auto

# Read-only for every job by default. Only the job that publishes the GitHub
# Release may write, and it runs only after both Macs' builds and checks
# passed, and never on a dry run.
permissions:
  contents: read


jobs:
  mac:
    name: Mac app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Built on a matching chip: the bundle ships one native module
          # (sharp, pulled in by Next) compiled for the machine that built it.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Tag matches package.json
        if: ${{ !inputs.dry_run }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$ver" ]; then
            echo "::error::Tag $tag does not match package.json version $ver. Bump the version first."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # Which shell (docs/brain/DESKTOP.md): the Electron app for everything since
      # 0.2.0. The classic launcher stays buildable (shell: classic) as the
      # fallback for one full release after the switch (rule 5).
      - name: Build the app and disk image
        run: |
          shell="${{ inputs.shell || 'auto' }}"
          [ "$shell" = auto ] && shell=electron
          echo "Building the $shell app"
          echo "APP_SHELL=$shell" >> "$GITHUB_ENV"
          node scripts/build-app.mjs --shell="$shell"
        env:
          BUNDLE_ARCH: ${{ matrix.arch }}
      # The Electron app as people get it: installed from its own disk image by
      # install.sh, not the copy in dist/ (a link that only resolves on the build
      # machine passes there and fails everywhere else, TRAPS §37). Then check
      # the scanner's Python inside it, open it, reach it, refuse a second copy,
      # quit it; open it again without that Python, quit it mid-job, and check
      # that nothing is left running.
      - name: Install it from the disk image, open, reach, quit, and check nothing is left
        if: env.APP_SHELL == 'electron'
        run: |
          set -u
          apps="$RUNNER_TEMP/apps"
          SIX_DEGREES_DMG="$(ls dist/*.dmg)" SIX_DEGREES_DEST="$apps" SIX_DEGREES_NO_OPEN=1 bash install.sh
          app="$apps/Six Degrees.app"
          codesign --verify --deep --strict "$app"
          if find "$app" -type l -exec readlink {} \; | grep -q '^/'; then echo "::error::The installed app has absolute symlinks"; exit 1; fi

          # The scanner's Python, inside the app (DESKTOP.md D2): it runs, as this
          # chip, and its packages load, compiled parts included (TRAPS §30).
          # Every run of it here has PYTHONDONTWRITEBYTECODE=1: without it Python
          # writes __pycache__ into the app, which breaks the app's signature
          # ("a sealed resource is missing or invalid") and fails the check
          # after the first quit. Not set for the whole step: the app must keep
          # its own Python from writing, and this check is how CI knows it does.
          py="$app/Contents/Resources/python/bin/python3"
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 "$py" -c 'import sys, platform, requests; from PIL import Image; from playwright.sync_api import sync_playwright; from importlib.metadata import version as v; print("Python", sys.version.split()[0], platform.machine(), "· Playwright", v("playwright"), "· requests", v("requests"), "· Pillow", v("pillow"))'
          want=$([ "${{ matrix.arch }}" = x64 ] && echo x86_64 || echo arm64)
          got=$(PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 "$py" -c 'import platform; print(platform.machine())')
          [ "$got" = "$want" ] || { echo "::error::The app's Python runs as $got, not $want"; exit 1; }
          # scrape.py's pure functions on it: the same checks npm test runs on python3.
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 SIX_DEGREES_TEST_PYTHON="$py" node --test \
            tests/linkedin-limits.test.mjs tests/paused.test.mjs tests/bridge-progress.test.mjs \
            tests/profile-shown.test.mjs tests/scraper-js.test.mjs

          export SIX_DEGREES_HOME="$RUNNER_TEMP/six-degrees-home" SIX_DEGREES_SMOKE=1
          export SIX_DEGREES_SMOKE_SHOT="$RUNNER_TEMP/window-${{ matrix.arch }}.png"
          start_app() {   # log file; sets app_pid and url
            "$app/Contents/MacOS/Six Degrees" > "$1" 2>&1 &
            app_pid=$!
            url=""
            for i in $(seq 1 120); do
              url=$(grep -o 'SIX_DEGREES_READY http://[0-9.:]*' "$1" | awk '{print $2}' | tail -1)
              [ -n "$url" ] && break
              kill -0 $app_pid 2>/dev/null || { echo "::error::The app exited while starting"; cat "$1"; exit 1; }
              sleep 1
            done
            [ -n "$url" ] || { echo "::error::The app never became ready"; cat "$1"; exit 1; }
            echo "Running at $url"
          }
          quit_app() {   # jobs to check; quits the app and checks nothing of it is left
            kill -TERM $app_pid
            for i in $(seq 1 40); do kill -0 $app_pid 2>/dev/null || break; sleep 1; done
            if kill -0 $app_pid 2>/dev/null; then echo "::error::The app did not quit"; exit 1; fi
            sleep 2
            for j in $1; do if kill -0 "$j" 2>/dev/null; then echo "::error::Job $j was left running"; exit 1; fi; done
            if lsof -nP -iTCP:"${url##*:}" -sTCP:LISTEN; then echo "::error::The server was left running"; exit 1; fi
            if ps -axo command | grep -F "$app/Contents/" | grep -v grep; then echo "::error::App processes were left running"; exit 1; fi
          }

          start_app "$RUNNER_TEMP/app.log"
          for p in "" paths queue setup settings api/network api/company-scores api/scraper api/settings; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/$p"); echo "  /$p $code"
            [ "$code" = 200 ] || exit 1
          done
          # The scanner runs on the app's own Python: nothing to install.
          curl -s "$url/api/scraper" | APP="$app" node -e '
            const c = JSON.parse(require("fs").readFileSync(0, "utf8")).checks;
            console.log("  scanner:", c.pythonSource, c.pythonVersion, c.pythonPath);
            if (c.pythonSource !== "bundled" || !c.dependencies || !c.pythonPath.startsWith(process.env.APP + "/")) process.exit(1);
          ' || { echo "::error::The scanner isn't using the Python inside the app"; exit 1; }

          "$app/Contents/MacOS/Six Degrees" > "$RUNNER_TEMP/second.log" 2>&1 &
          second=$!
          for i in $(seq 1 20); do kill -0 $second 2>/dev/null || break; sleep 1; done
          if kill -0 $second 2>/dev/null; then echo "::error::A second copy kept running"; exit 1; fi
          echo "A second launch handed over and exited"
          quit_app ""
          # The app ran its Python (the checks above), and must not have written into itself.
          if find "$app/Contents/Resources/python" -name __pycache__ | grep -q .; then echo "::error::Something wrote bytecode into the app's Python"; exit 1; fi

          # Again with the app's Python turned off (an empty SIX_DEGREES_PYTHON):
          # the fallback that npm and source copies use, and a job to stop. The
          # scanner's setup (pip, no LinkedIn), uncached so it runs a while.
          SIX_DEGREES_PYTHON= start_app "$RUNNER_TEMP/app-fallback.log"
          server=$(lsof -nP -iTCP:"${url##*:}" -sTCP:LISTEN | awk 'NR==2{print $2}')
          answer=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"action":"install"}' "$url/api/scraper"); echo "$answer"
          echo "$answer" | grep -q '"ok":true' || { echo "::error::The scanner's setup didn't start"; exit 1; }
          sleep 3
          jobs=$(pgrep -P "$server" | tr '\n' ' ' || true)
          echo "job processes: ${jobs:-none}"
          [ -n "$jobs" ] || { echo "::error::No job was running to stop"; exit 1; }
          quit_app "$jobs"
          echo "Installed from the image, its Python works, opened, reached, refused a second copy, quit mid-job, left nothing."
        env:
          PIP_NO_CACHE_DIR: '1'
      - uses: actions/upload-artifact@v4
        if: always() && env.APP_SHELL == 'electron'
        with:
          name: window-${{ matrix.arch }}
          path: ${{ runner.temp }}/window-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: mac
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create / upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: out
      # Two downloads with names that never change, so the README's buttons can
      # point at releases/latest/download/<name> and always get the newest app.
      # install.sh keeps using the versioned names (…-<version>-arm64.dmg).
      - name: Downloads with fixed names, and checksums
        working-directory: out
        run: |
          for f in *.dmg; do
            case "$f" in
              *-arm64.dmg) cp "$f" Six-Degrees-Mac-Apple-Silicon.dmg ;;
              *-x64.dmg)   cp "$f" Six-Degrees-Mac-Intel.dmg ;;
            esac
          done
          sha256sum *.dmg > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # A tag with a hyphen (v0.2.0-beta.1) is a pre-release. install.sh and the
        # app's Updates panel follow releases/latest, which never returns one, so a
        # beta reaches only someone who asks for it by version (DESKTOP.md rule 4).
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
          elif [ -n "$pre" ]; then
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --prerelease --title "$TAG (beta)" --notes "$(cat <<EOF
          **Beta.** Not offered to anyone automatically: the one-line install and the app's Updates panel skip pre-releases.

          To try it without touching your normal copy, install it to a separate folder:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/blakeb056/six-degrees/main/install.sh | SIX_DEGREES_VERSION=${TAG#v} SIX_DEGREES_DEST=~/Applications/Six-Degrees-Beta bash
          \`\`\`

          Your data is copied into ~/.six-degrees/backups/ before a new version first opens it.

          What changed: see [CHANGELOG.md](https://github.com/blakeb056/six-degrees/blob/main/CHANGELOG.md).
          EOF
          )"
          else
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "$(cat <<'EOF'
          **Download for Mac:** **Six-Degrees-Mac-Apple-Silicon.dmg** (any Mac with an Apple M chip) or **Six-Degrees-Mac-Intel.dmg** (older Intel Macs), below. Not sure which? Apple menu → About This Mac: "Chip: Apple M…" is Apple Silicon, "Processor: Intel" is Intel. Needs macOS 13.5 (Ventura) or later.

          Open the `.dmg` and drag **Six Degrees** to Applications. It isn't signed with a paid Apple certificate yet, so the first time you open it macOS says it can't check it: close that message (not *Move to Trash*), then go to **System Settings → Privacy & Security → Open Anyway**. Once per download.

          **Or install from Terminal** (no Open Anyway step, and running it again updates):

          ```
          curl -fsSL https://raw.githubusercontent.com/blakeb056/six-degrees/main/install.sh | bash
          ```

          What changed: see [CHANGELOG.md](https://github.com/blakeb056/six-degrees/blob/main/CHANGELOG.md).
          EOF
          )"
          fi

  npm-package:
    name: npm package (build and check)
    needs: mac
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/npm-package.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  npm:
    name: npm publish
    needs: [release, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets GitHub vouch for this run to npm (trusted publishing)
    steps:
      # No registry-url: that writes an .npmrc expecting a token, which can hide
      # a trusted-publishing failure behind a confusing auth error.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Publish the checked tarball
        run: |
          npm --version   # trusted publishing needs 11.5.1 or later
          TGZ=$(ls six-degrees-*.tgz)
          sha256sum -c "$TGZ.sha256"
          VERSION=${TGZ#six-degrees-}; VERSION=${VERSION%.tgz}
          if npm view "six-degrees@$VERSION" version >/dev/null 2>&1; then
            echo "six-degrees@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          # A pre-release goes out under "next", never "latest", so `npx six-degrees`
          # keeps running the last full release.
          case "$VERSION" in
            *-*) npm publish "./$TGZ" --tag next ;;
            *)   npm publish "./$TGZ" ;;
          esac
