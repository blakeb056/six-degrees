name: Release

# Push a tag like v0.2.0 and this builds the Mac app for both chips and the
# Windows zip, publishes them with a SHA256SUMS checksum file on a GitHub
# Release, and — if an NPM_TOKEN secret is configured — publishes the npm
# package too.
#
# install.sh and install.ps1 download from the Release this creates, so nothing reaches users
# until a tag is pushed. Cutting one:
#
#   npm version 0.2.0 --no-git-tag-version   # bump package.json
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# Testing the packaging without publishing anything — do this before tagging
# whenever scripts/build-app.mjs or this file changed:
#
#   gh workflow run release.yml --ref <branch> -f dry_run=true
#
# A dry run builds both .dmg files on GitHub's Macs and the Windows zip on a
# Windows machine (installed and started there as a check) and keeps them as
# workflow artifacts. No tag, no Release, no npm.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v0.2.0 (leave empty for a dry run)'
        required: false
      dry_run:
        description: 'Build the .dmg files only and publish nothing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mac:
    name: Mac app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Built on a matching chip: the bundle ships one native module
          # (sharp, pulled in by Next) compiled for the machine that built it.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Tag matches package.json
        if: ${{ !inputs.dry_run }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$ver" ]; then
            echo "::error::Tag $tag does not match package.json version $ver. Bump the version first."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Build the app and disk image
        run: node scripts/build-app.mjs
        env:
          BUNDLE_ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows app
    runs-on: windows-latest
    # A hang must fail the build in minutes, not hold the release for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Tag matches package.json
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$ver" ]; then
            echo "::error::Tag $tag does not match package.json version $ver. Bump the version first."
            exit 1
          fi
      - run: npm ci
      # Windows Python has no time zone database; the scanner's setup installs
      # tzdata (scripts/requirements.txt), and the scanner test needs it too.
      - run: py -m pip install --quiet tzdata
      - run: npm test
      - name: Build the Windows zip
        run: node scripts/build-windows.mjs
      # Install it the way a user does — install.ps1 run as a string, as
      # `irm … | iex` runs it — in Windows PowerShell 5.1, the one every Windows
      # PC has. Then start it, reach it, update over the running copy, stop it.
      - name: Install, start, update and stop it
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SIX_DEGREES_ZIP = (Get-ChildItem dist\*-win-x64.zip).FullName
          $env:SIX_DEGREES_NO_OPEN = '1'
          $env:SIX_DEGREES_NO_DESKTOP = '1'
          $env:SIX_DEGREES_HOME = Join-Path $env:RUNNER_TEMP 'six-degrees-home'
          $dest = Join-Path $env:LOCALAPPDATA 'Programs\Six Degrees'
          $launcher = Join-Path $dest 'launch.ps1'
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          function Get-Page($url) { Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 60 }

          Get-Content .\install.ps1 -Raw | Invoke-Expression
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Six Degrees\Six Degrees.lnk'))) { throw 'No Start Menu shortcut' }

          $url = (& $ps -NoProfile -ExecutionPolicy Bypass -File $launcher -NoOpen | Select-Object -Last 1).Trim()
          Write-Host "Running at $url"
          foreach ($path in '', 'paths', 'queue', 'api/network', 'api/company-scores', 'api/scraper') {
            $r = Get-Page ($url + $path)
            if ($r.StatusCode -ne 200) { throw "/$path answered $($r.StatusCode)" }
            Write-Host "  /$path  200"
          }
          if ((Get-Page $url).Content -notmatch '6 Degrees') { throw 'The home page is not Six Degrees' }

          $again = (& $ps -NoProfile -ExecutionPolicy Bypass -File $launcher -NoOpen | Select-Object -Last 1).Trim()
          if ($again -ne $url) { throw "A second launch started another copy ($again) instead of reusing $url" }

          Get-Content .\install.ps1 -Raw | Invoke-Expression      # an update over the running copy
          $old = Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -ieq (Join-Path $dest 'node.exe') }
          if ($old) { throw 'The update left the old copy running' }
          $url = (& $ps -NoProfile -ExecutionPolicy Bypass -File $launcher -NoOpen | Select-Object -Last 1).Trim()
          if ((Get-Page $url).StatusCode -ne 200) { throw 'Did not start after the update' }

          & $ps -NoProfile -ExecutionPolicy Bypass -File $launcher -Stop
          Start-Sleep -Seconds 2
          if (Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -ieq (Join-Path $dest 'node.exe') }) { throw 'Stop left it running' }
          Write-Host 'Installed, started, reused, updated and stopped.'
      - name: Show the server log if that failed
        if: failure()
        shell: powershell
        run: Get-Content (Join-Path $env:TEMP 'six-degrees.log*') -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [mac, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: out
      - name: Checksums
        working-directory: out
        run: sha256sum *.dmg *.zip > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "$(cat <<'EOF'
          **Install on a Mac** — paste into Terminal:

          ```
          curl -fsSL https://raw.githubusercontent.com/blakeb056/six-degrees/main/install.sh | bash
          ```

          **Install on Windows** — paste into PowerShell:

          ```
          irm https://raw.githubusercontent.com/blakeb056/six-degrees/main/install.ps1 | iex
          ```

          **Mac:** or download the `.dmg` for your chip below (`arm64` = Apple Silicon, `x64` = Intel). The app is not signed with a paid Apple certificate, so a browser-downloaded copy needs a one-time **System Settings → Privacy & Security → Open Anyway**.

          Any system with Node 22.13+: `npx six-degrees@latest`

          What changed: see CHANGELOG.md.
          EOF
          )"
          fi

  npm:
    name: npm package
    needs: mac
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Publish (skipped until an NPM_TOKEN secret exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret — skipping npm publish."
            exit 0
          fi
          npm ci
          npm publish --provenance --access public
    permissions:
      contents: read
      id-token: write
