name: Release

# Push a tag like v0.2.0 and this builds the Mac app for both chips, publishes
# the .dmg files with a SHA256SUMS checksum file on a GitHub Release, then builds
# the npm package on Linux, checks it installs and serves the app
# (npm-package.yml), and publishes that exact tarball to npm.
#
# npm publishing uses npm's trusted publishing: npm is set up (package Settings →
# Trusted Publisher) to accept blakeb056/six-degrees's release.yml, and GitHub
# vouches for this run with a short-lived token. No npm token is stored anywhere.
# Renaming this file breaks that link; update it on npmjs.com if you do.
# Since the rename to Sixgree the package is "sixgree", whose Trusted Publisher
# must be set up the same way (after a first publish by hand). Until it is, the
# npm job fails on its own and the rest of the release still counts.
#
# install.sh downloads from the Release this creates, so nothing reaches users
# until a tag is pushed. Cutting one:
#
#   npm version 0.2.0 --no-git-tag-version   # bump package.json
#   # a full release: the site's version lines too (docs/SEO.md), then
#   node scripts/check-site-version.mjs      # this workflow runs it as well
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# Testing the packaging without publishing anything — do this before tagging
# whenever scripts/build-app.mjs or this file changed:
#
#   gh workflow run release.yml --ref <branch> -f dry_run=true
#
# A dry run builds both .dmg files on GitHub's Macs and keeps them as workflow
# artifacts. No tag, no Release, no npm.
#
# Mac signing (docs/brain/DESKTOP.md D4): with the five secrets
# MACOS_SIGN_P12_BASE64, MACOS_SIGN_P12_PASSWORD, APPLE_API_KEY_P8_BASE64,
# APPLE_API_KEY_ID and APPLE_API_ISSUER_ID (scripts/set-signing-secrets.sh sets
# them), both Mac apps are signed with Developer ID and notarized by Apple, dry
# runs included (notarizing publishes nothing). A real release of 1.0.0 or later
# fails without them; before that, and on a dry run, it builds ad hoc as before.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v0.2.0 (leave empty for a dry run)'
        required: false
      dry_run:
        description: 'Build the .dmg files only and publish nothing'
        type: boolean
        default: false
      shell:
        description: 'Which Mac app: auto (electron, the main app since 0.2.0), electron, or classic (the pre-0.2 launcher, kept as a fallback)'
        type: choice
        options: [auto, electron, classic]
        default: auto

# Read-only for every job by default. Only the job that publishes the GitHub
# Release may write, and it runs only after both Macs' builds and checks
# passed, and never on a dry run.
permissions:
  contents: read


jobs:
  mac:
    name: Mac app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Built on a matching chip: the bundle ships one native module
          # (sharp, pulled in by Next) compiled for the machine that built it.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Tag matches package.json
        if: ${{ !inputs.dry_run }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$ver" ]; then
            echo "::error::Tag $tag does not match package.json version $ver. Bump the version first."
            exit 1
          fi
      # The download website says this version (docs/SEO.md, "Release
      # checklist"): softwareVersion and llms.txt name it, and dateModified and
      # the sitemap's lastmod aren't older than its date in CHANGELOG.md. Before
      # any build, so a stale site stops the release in seconds. A pre-release
      # passes: the site keeps describing the last full release.
      - name: The website says this version
        if: ${{ !inputs.dry_run }}
        run: node scripts/check-site-version.mjs
      - run: npm ci
      - run: npm test
      # Developer ID (docs/brain/DESKTOP.md D4): with the five secrets, the
      # certificate goes into a temporary keychain and the build signs every
      # program inside out, notarizes the app and the disk image with Apple and
      # staples both. A real release of 1.0.0 or later must be signed: without
      # the secrets it fails here, before anything is built. Dry runs and
      # releases before 1.0 without them are signed ad hoc, as before. Some
      # secrets but not all always fails. The secrets reach only this step
      # (scripts/ci-mac-signing.sh, which never prints one) and, for notarytool,
      # the build step below.
      - name: Signing identity, in a temporary keychain
        run: bash scripts/ci-mac-signing.sh setup "$(node -p "require('./package.json').version")" "${{ inputs.dry_run && 'true' || 'false' }}"
        env:
          MACOS_SIGN_P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      # Which shell (docs/brain/DESKTOP.md): the Electron app for everything since
      # 0.2.0. The classic launcher stays buildable (shell: classic) as the
      # fallback for one full release after the switch (rule 5).
      - name: Build the app and disk image
        run: |
          shell="${{ inputs.shell || 'auto' }}"
          [ "$shell" = auto ] && shell=electron
          echo "Building the $shell app"
          echo "APP_SHELL=$shell" >> "$GITHUB_ENV"
          node scripts/build-app.mjs --shell="$shell"
        env:
          BUNDLE_ARCH: ${{ matrix.arch }}
          # Notarization's key id and issuer, straight from the secrets; the key
          # itself, the identity and its keychain come from the step above
          # ($GITHUB_ENV). Empty without the secrets, and then nothing notarizes.
          SIX_DEGREES_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SIX_DEGREES_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      # The Electron app as people get it: installed from its own disk image by
      # install.sh, not the copy in dist/ (a link that only resolves on the build
      # machine passes there and fails everywhere else, TRAPS §37). Then check
      # the scanner's Python inside it, open it, reach it, refuse a second copy,
      # quit it; open it again without that Python, quit it mid-job, and check
      # that nothing is left running.
      - name: Install it from the disk image, open, reach, quit, and check nothing is left
        if: env.APP_SHELL == 'electron'
        run: |
          set -u
          apps="$RUNNER_TEMP/apps"
          SIX_DEGREES_DMG="$(ls dist/*.dmg)" SIX_DEGREES_DEST="$apps" SIX_DEGREES_NO_OPEN=1 bash install.sh
          app="$apps/Six Degrees.app"
          codesign --verify --deep --strict "$app" || { echo "::error::The installed app's signature doesn't verify"; exit 1; }
          if find "$app" -type l -exec readlink {} \; | grep -q '^/'; then echo "::error::The installed app has absolute symlinks"; exit 1; fi

          # Signed and notarized (DESKTOP.md D4): Gatekeeper accepts the disk image
          # by its own signature and the app installed from it, both carry their
          # stapled tickets (install.sh copies the app out with ditto), and the
          # app has the hardened runtime. Everything below then runs under it, so
          # the smoke test is also the test of the entitlements.
          if [ "${MAC_SIGNING:-ad-hoc}" = developer-id ]; then
            dmg="$(ls dist/*.dmg)"
            # A runner with Gatekeeper's assessments turned off accepts anything,
            # so there only the tickets can say (and the build's notarytool did).
            gatekeeper=on
            spctl --status 2>&1 | grep -q 'assessments disabled' && gatekeeper=off
            [ "$gatekeeper" = on ] || echo "::warning::Gatekeeper's assessments are off on this runner: checking the stapled tickets only"
            verdict="$(spctl -a -vvv -t open --context context:primary-signature "$dmg" 2>&1 || true)"; echo "$verdict"
            [ "$gatekeeper" = off ] || echo "$verdict" | grep -qx 'source=Notarized Developer ID' || { echo "::error::Gatekeeper doesn't accept the disk image as notarized"; exit 1; }
            xcrun stapler validate "$dmg" || { echo "::error::The disk image has no stapled ticket"; exit 1; }
            verdict="$(spctl -a -vvv -t exec "$app" 2>&1 || true)"; echo "$verdict"
            [ "$gatekeeper" = off ] || echo "$verdict" | grep -qx 'source=Notarized Developer ID' || { echo "::error::Gatekeeper doesn't accept the installed app as notarized"; exit 1; }
            xcrun stapler validate "$app" || { echo "::error::The installed app has no stapled ticket"; exit 1; }
            codesign -dv "$app" 2>&1 | grep -q 'flags=0x[0-9a-f]*(runtime)' || { echo "::error::The app isn't signed with the hardened runtime"; exit 1; }
            echo "Notarized and stapled: the disk image and the installed app."
          fi

          # The scanner's Python, inside the app (DESKTOP.md D2): it runs, as this
          # chip, and its packages load, compiled parts included (TRAPS §30).
          # Every run of it here has PYTHONDONTWRITEBYTECODE=1: without it Python
          # writes __pycache__ into the app, which breaks the app's signature
          # ("a sealed resource is missing or invalid") and fails the check
          # after the first quit. Not set for the whole step: the app must keep
          # its own Python from writing, and this check is how CI knows it does.
          py="$app/Contents/Resources/python/bin/python3"
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 "$py" -c 'import sys, platform, requests; from PIL import Image; from playwright.sync_api import sync_playwright; from importlib.metadata import version as v; print("Python", sys.version.split()[0], platform.machine(), "· Playwright", v("playwright"), "· requests", v("requests"), "· Pillow", v("pillow"))'
          want=$([ "${{ matrix.arch }}" = x64 ] && echo x86_64 || echo arm64)
          got=$(PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 "$py" -c 'import platform; print(platform.machine())')
          [ "$got" = "$want" ] || { echo "::error::The app's Python runs as $got, not $want"; exit 1; }
          # scrape.py's pure functions on it: the same checks npm test runs on python3.
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 SIX_DEGREES_TEST_PYTHON="$py" node --test \
            tests/linkedin-limits.test.mjs tests/paused.test.mjs tests/bridge-progress.test.mjs \
            tests/profile-shown.test.mjs tests/scraper-js.test.mjs

          export SIX_DEGREES_HOME="$RUNNER_TEMP/six-degrees-home" SIX_DEGREES_SMOKE=1
          export SIX_DEGREES_SMOKE_SHOT="$RUNNER_TEMP/window-${{ matrix.arch }}.png"
          start_app() {   # log file; sets app_pid and url
            "$app/Contents/MacOS/Six Degrees" > "$1" 2>&1 &
            app_pid=$!
            url=""
            for i in $(seq 1 120); do
              url=$(grep -o 'SIX_DEGREES_READY http://[0-9.:]*' "$1" | awk '{print $2}' | tail -1)
              [ -n "$url" ] && break
              kill -0 $app_pid 2>/dev/null || { echo "::error::The app exited while starting"; cat "$1"; exit 1; }
              sleep 1
            done
            [ -n "$url" ] || { echo "::error::The app never became ready"; cat "$1"; exit 1; }
            echo "Running at $url"
          }
          quit_app() {   # jobs to check; quits the app and checks nothing of it is left
            kill -TERM $app_pid
            for i in $(seq 1 40); do kill -0 $app_pid 2>/dev/null || break; sleep 1; done
            if kill -0 $app_pid 2>/dev/null; then echo "::error::The app did not quit"; exit 1; fi
            sleep 2
            for j in $1; do if kill -0 "$j" 2>/dev/null; then echo "::error::Job $j was left running"; exit 1; fi; done
            if lsof -nP -iTCP:"${url##*:}" -sTCP:LISTEN; then echo "::error::The server was left running"; exit 1; fi
            if ps -axo command | grep -F "$app/Contents/" | grep -v grep; then echo "::error::App processes were left running"; exit 1; fi
          }

          start_app "$RUNNER_TEMP/app.log"
          for p in "" paths queue setup settings api/network api/company-scores api/scraper api/settings; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/$p"); echo "  /$p $code"
            [ "$code" = 200 ] || exit 1
          done
          # The scanner runs on the app's own Python: nothing to install.
          curl -s "$url/api/scraper" | APP="$app" node -e '
            const c = JSON.parse(require("fs").readFileSync(0, "utf8")).checks;
            console.log("  scanner:", c.pythonSource, c.pythonVersion, c.pythonPath);
            if (c.pythonSource !== "bundled" || !c.dependencies || !c.pythonPath.startsWith(process.env.APP + "/")) process.exit(1);
          ' || { echo "::error::The scanner isn't using the Python inside the app"; exit 1; }

          "$app/Contents/MacOS/Six Degrees" > "$RUNNER_TEMP/second.log" 2>&1 &
          second=$!
          for i in $(seq 1 20); do kill -0 $second 2>/dev/null || break; sleep 1; done
          if kill -0 $second 2>/dev/null; then echo "::error::A second copy kept running"; exit 1; fi
          echo "A second launch handed over and exited"
          quit_app ""
          # The app ran its Python (the checks above), and must not have written into itself.
          if find "$app/Contents/Resources/python" -name __pycache__ | grep -q .; then echo "::error::Something wrote bytecode into the app's Python"; exit 1; fi

          # Again with the app's Python turned off (an empty SIX_DEGREES_PYTHON):
          # the fallback that npm and source copies use, and a job to stop. The
          # scanner's setup (pip, no LinkedIn), uncached so it runs a while.
          SIX_DEGREES_PYTHON= start_app "$RUNNER_TEMP/app-fallback.log"
          server=$(lsof -nP -iTCP:"${url##*:}" -sTCP:LISTEN | awk 'NR==2{print $2}')
          answer=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"action":"install"}' "$url/api/scraper"); echo "$answer"
          echo "$answer" | grep -q '"ok":true' || { echo "::error::The scanner's setup didn't start"; exit 1; }
          sleep 3
          jobs=$(pgrep -P "$server" | tr '\n' ' ' || true)
          echo "job processes: ${jobs:-none}"
          [ -n "$jobs" ] || { echo "::error::No job was running to stop"; exit 1; }
          quit_app "$jobs"
          echo "Installed from the image, its Python works, opened, reached, refused a second copy, quit mid-job, left nothing."
        env:
          PIP_NO_CACHE_DIR: '1'
      # The keychain, the decoded key and certificate, and the search list, put
      # back whatever happened above.
      - name: Remove the signing keychain and keys
        if: always()
        run: bash scripts/ci-mac-signing.sh cleanup
      # How this chip's app was signed, for the release notes: "developer-id"
      # (notarized: the build and the smoke test above checked it) or "ad-hoc".
      - name: Record how it was signed
        run: echo "${MAC_SIGNING:-ad-hoc}" > "$RUNNER_TEMP/signing-${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: signing-${{ matrix.arch }}
          path: ${{ runner.temp }}/signing-${{ matrix.arch }}.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && env.APP_SHELL == 'electron'
        with:
          name: window-${{ matrix.arch }}
          path: ${{ runner.temp }}/window-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  # Windows (docs/brain/DESKTOP.md D3): the same app, as a one-click per-user
  # Setup.exe (scripts/build-desktop.mjs, scripts/windows/six-degrees.iss).
  # Installed silently as a user would get it, then the same checks as the Mac
  # app (scripts/smoke-desktop.mjs), then uninstalled with the data left alone.
  windows:
    name: Windows app (x64)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Tag matches package.json
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="$(node -p "require('./package.json').version")"
          [ "${tag#v}" = "$ver" ] || { echo "::error::Tag $tag does not match package.json version $ver."; exit 1; }
      # --force: package.json's "os" keeps the npm package (npx sixgree) off
      # Windows, where it doesn't run; the desktop app is built here regardless.
      - run: npm ci --force
      - name: Build Setup.exe
        run: node scripts/build-desktop.mjs --platform=win32
      - name: Install it silently, check its Python, open, reach, quit, nothing left, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\Sixgree-*-win-x64-Setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 60; throw "Setup failed ($($p.ExitCode))" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Six Degrees'
          if (-not (Test-Path "$app\Six Degrees.exe")) { throw 'Setup did not install Six Degrees.exe' }
          foreach ($lnk in @((Join-Path ([Environment]::GetFolderPath('Programs')) 'Sixgree.lnk'), (Join-Path ([Environment]::GetFolderPath('Desktop')) 'Sixgree.lnk'))) {
            if (-not (Test-Path $lnk)) { throw "No shortcut at $lnk" }
          }
          $env:PYTHONDONTWRITEBYTECODE = '1'
          & "$app\resources\python\python.exe" -E -s -B -X utf8 -c "import sys, platform, zoneinfo, requests; from PIL import Image; from playwright.sync_api import sync_playwright; zoneinfo.ZoneInfo('America/Los_Angeles'); print('Python', sys.version.split()[0], platform.machine(), '→ ok')"
          if ($LASTEXITCODE -ne 0) { throw 'The app''s Python failed its check' }
          Remove-Item Env:PYTHONDONTWRITEBYTECODE
          node scripts/smoke-desktop.mjs --exe "$app\Six Degrees.exe" --dir $app --home "$env:RUNNER_TEMP\sd-home" --shot "$env:RUNNER_TEMP\window-windows.png"
          if ($LASTEXITCODE -ne 0) { throw 'The smoke test failed' }
          # Uninstall: the app goes, the data stays (DESKTOP.md rule 3).
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\Six Degrees.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\Six Degrees.exe") { throw 'Uninstalling left the app behind' }
          if (-not (Test-Path "$env:RUNNER_TEMP\sd-home\six-degrees.sqlite")) { throw 'The data folder did not survive' }
          Write-Host 'Installed, Python checked, opened, reached, quit, left nothing, uninstalled with the data kept.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-windows
          path: ${{ runner.temp }}/window-windows.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: setup-win-x64
          path: dist/*-Setup.exe
          if-no-files-found: error

  # Linux (x64): a .deb (chrome-sandbox setuid root, which Electron needs on
  # Ubuntu 24.04 and later) and a .tar.gz. The .deb is installed as a user would,
  # then the same checks under a virtual display.
  linux:
    name: Linux app (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Tag matches package.json
        if: ${{ !inputs.dry_run }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="$(node -p "require('./package.json').version")"
          [ "${tag#v}" = "$ver" ] || { echo "::error::Tag $tag does not match package.json version $ver."; exit 1; }
      - run: npm ci
      - name: Build the .deb and .tar.gz
        run: node scripts/build-desktop.mjs --platform=linux
      - name: Install the .deb, check its Python, open, reach, quit, nothing left
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/six-degrees_*_amd64.deb xvfb
          app=/opt/six-degrees
          [ "$(stat -c '%U %a' $app/chrome-sandbox)" = "root 4755" ] || { echo "::error::chrome-sandbox isn't setuid root"; exit 1; }
          if find "$app" -type l -exec readlink {} \; | grep -q '^/'; then echo "::error::The installed app has absolute symlinks"; exit 1; fi
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 "$app/resources/python/bin/python3" -c 'import sys, platform, requests; from PIL import Image; from playwright.sync_api import sync_playwright; print("Python", sys.version.split()[0], platform.machine(), "→ ok")'
          PYTHONNOUSERSITE=1 PYTHONDONTWRITEBYTECODE=1 SIX_DEGREES_TEST_PYTHON="$app/resources/python/bin/python3" node --test \
            tests/linkedin-limits.test.mjs tests/paused.test.mjs tests/bridge-progress.test.mjs \
            tests/profile-shown.test.mjs tests/scraper-js.test.mjs
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          node scripts/smoke-desktop.mjs --exe "$app/six-degrees" --dir "$app" --home "$RUNNER_TEMP/sd-home" --shot "$RUNNER_TEMP/window-linux.png"
          echo "Installed from the .deb, its Python works, opened, reached, quit, left nothing."
        env:
          PIP_NO_CACHE_DIR: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-linux
          path: ${{ runner.temp }}/window-linux.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-x64
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [mac, windows, linux]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create / upload
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: out
      # Windows and Linux (DESKTOP.md D3). By name: a bare pattern would publish the window pictures too.
      - uses: actions/download-artifact@v4
        with:
          pattern: setup-win-*
          merge-multiple: true
          path: out
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-linux-*
          merge-multiple: true
          path: out
      # How each Mac app was signed (not published: out/ is, signing/ isn't).
      - uses: actions/download-artifact@v4
        with:
          pattern: signing-*
          merge-multiple: true
          path: signing
      # Two downloads with names that never change, so the README's buttons can
      # point at releases/latest/download/<name> and always get the newest app.
      # install.sh keeps using the versioned names (…-<version>-arm64.dmg).
      #
      # Since the rename to Sixgree every download is published under its new
      # name AND its old Six-Degrees-… name, the same file twice, both in
      # SHA256SUMS: 1.0.0's updater asks for exactly Six-Degrees-<version>-<chip>.dmg
      # (lib/updater.js legacyDmgName), and old links point at the old fixed names.
      - name: Downloads with fixed names, and checksums
        working-directory: out
        run: |
          for f in Sixgree-*.dmg; do
            [ -e "$f" ] || continue
            cp "$f" "Six-Degrees-${f#Sixgree-}"
            case "$f" in
              *-arm64.dmg) cp "$f" Sixgree-Mac-Apple-Silicon.dmg; cp "$f" Six-Degrees-Mac-Apple-Silicon.dmg ;;
              *-x64.dmg)   cp "$f" Sixgree-Mac-Intel.dmg;         cp "$f" Six-Degrees-Mac-Intel.dmg ;;
            esac
          done
          # Windows and Linux under fixed names too (never ending in -arm64.dmg or
          # -x64.dmg, which install.sh and the Mac updater look for).
          for f in Sixgree-*-win-x64-Setup.exe; do [ -e "$f" ] && cp "$f" Sixgree-Windows-Setup.exe && cp "$f" Six-Degrees-Windows-Setup.exe; done
          for f in six-degrees_*_amd64.deb; do [ -e "$f" ] && cp "$f" Sixgree-Linux-x64.deb && cp "$f" Six-Degrees-Linux-x64.deb; done
          for f in Sixgree-*-linux-x64.tar.gz; do [ -e "$f" ] && cp "$f" Sixgree-Linux-x64.tar.gz && cp "$f" Six-Degrees-Linux-x64.tar.gz; done
          # Every Mac image must be there under both names, or 1.0.0 can't update.
          for f in Sixgree-*-arm64.dmg Sixgree-*-x64.dmg; do
            [ -e "$f" ] || { echo "::error::No $f"; exit 1; }
            cmp "$f" "Six-Degrees-${f#Sixgree-}" || { echo "::error::No old-name copy of $f"; exit 1; }
          done
          sha256sum $(ls *.dmg *.exe *.deb *.tar.gz 2>/dev/null) > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # A tag with a hyphen (v0.2.0-beta.1) is a pre-release. install.sh and the
        # app's Updates panel follow releases/latest, which never returns one, so a
        # beta reaches only someone who asks for it by version (DESKTOP.md rule 4).
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
          elif [ -n "$pre" ]; then
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --prerelease --title "$TAG (beta)" --notes "$(cat <<EOF
          **Beta.** Not offered to anyone automatically: the one-line install and the app's Updates panel skip pre-releases.

          **Windows (new, beta):** **Sixgree-Windows-Setup.exe**. One click installs it for you (no admin rights) with Start Menu and Desktop shortcuts. It isn't signed yet, so Windows SmartScreen may say it protected your PC: choose *More info → Run anyway*. Scanning needs Google Chrome.

          **Linux (new, beta):** **Sixgree-Linux-x64.deb** (`sudo apt install ./Sixgree-Linux-x64.deb`), or the **.tar.gz**: on Ubuntu 24.04 and later run `sudo chown root:root chrome-sandbox && sudo chmod 4755 chrome-sandbox` in its folder once, or start it with `--no-sandbox`. Scanning needs Google Chrome.

          To try it without touching your normal copy, install it to a separate folder:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/blakeb056/six-degrees/main/install.sh | SIX_DEGREES_VERSION=${TAG#v} SIX_DEGREES_DEST=~/Applications/Six-Degrees-Beta bash
          \`\`\`

          Your data is copied into ~/.six-degrees/backups/ before a new version first opens it.

          What changed: see [CHANGELOG.md](https://github.com/blakeb056/six-degrees/blob/main/CHANGELOG.md).
          EOF
          )"
          else
            # The Mac paragraph says what this release's apps are: signed and
            # notarized when both chips' builds were (signing/, from the Mac jobs,
            # which checked it), and the old Open Anyway steps otherwise (a release
            # before 1.0 built without the signing secrets).
            mac_signed=""
            if [ "$(cat signing/signing-arm64.txt 2>/dev/null)" = developer-id ] && [ "$(cat signing/signing-x64.txt 2>/dev/null)" = developer-id ]; then mac_signed=1; fi
            {
              cat <<'EOF'
          **Windows:** **Sixgree-Windows-Setup.exe**: one click installs it (no admin rights). Not signed yet, so SmartScreen may ask: *More info → Run anyway*. **Linux:** **Sixgree-Linux-x64.deb** (`sudo apt install ./Sixgree-Linux-x64.deb`) or the .tar.gz. Scanning needs Google Chrome on both.

          **Download for Mac:** **Sixgree-Mac-Apple-Silicon.dmg** (any Mac with an Apple M chip) or **Sixgree-Mac-Intel.dmg** (older Intel Macs), below. Not sure which? Apple menu → About This Mac: "Chip: Apple M…" is Apple Silicon, "Processor: Intel" is Intel. Needs macOS 13.5 (Ventura) or later.

          EOF
              if [ -n "$mac_signed" ]; then
                cat <<'EOF'
          Open the `.dmg` and drag **Sixgree** to Applications. Signed by Blake Burford and notarized by Apple: it opens like any Mac app. (The first time, macOS asks whether to open an app downloaded from the internet: click *Open*.)

          **Or install from Terminal** (running it again updates):

          EOF
              else
                cat <<'EOF'
          Open the `.dmg` and drag **Sixgree** to Applications. This build isn't signed with Apple's certificate, so the first time you open it macOS says it can't check it: close that message (not *Move to Trash*), then go to **System Settings → Privacy & Security → Open Anyway**. Once per download.

          **Or install from Terminal** (no Open Anyway step, and running it again updates):

          EOF
              fi
              cat <<'EOF'
          ```
          curl -fsSL https://raw.githubusercontent.com/blakeb056/six-degrees/main/install.sh | bash
          ```

          What changed: see [CHANGELOG.md](https://github.com/blakeb056/six-degrees/blob/main/CHANGELOG.md).
          EOF
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  npm-package:
    name: npm package (build and check)
    needs: mac
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/npm-package.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  npm:
    name: npm publish
    needs: [release, npm-package]
    runs-on: ubuntu-latest
    # The package became "sixgree" with the rename. npm's trusted publishing is
    # set up per package, so until "sixgree" has been published once by hand and
    # given this workflow as its Trusted Publisher, this job fails: it shows red,
    # but the GitHub Release above is already out and the run isn't failed by it.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write   # lets GitHub vouch for this run to npm (trusted publishing)
    steps:
      # No registry-url: that writes an .npmrc expecting a token, which can hide
      # a trusted-publishing failure behind a confusing auth error.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - name: Publish the checked tarball
        run: |
          npm --version   # trusted publishing needs 11.5.1 or later
          TGZ=$(ls sixgree-*.tgz)
          sha256sum -c "$TGZ.sha256"
          VERSION=${TGZ#sixgree-}; VERSION=${VERSION%.tgz}
          if npm view "sixgree@$VERSION" version >/dev/null 2>&1; then
            echo "sixgree@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          # A pre-release goes out under "next", never "latest", so `npx sixgree`
          # keeps running the last full release.
          case "$VERSION" in
            *-*) npm publish "./$TGZ" --tag next ;;
            *)   npm publish "./$TGZ" ;;
          esac
