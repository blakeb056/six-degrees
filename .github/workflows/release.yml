name: Release

# Push a tag like v0.2.0 and this builds the Mac app for both chips, publishes
# the .dmg files with a SHA256SUMS checksum file on a GitHub Release, and — if
# an NPM_TOKEN secret is configured — publishes the npm package too.
#
# install.sh downloads from the Release this creates, so nothing reaches users
# until a tag is pushed. Cutting one:
#
#   npm version 0.2.0 --no-git-tag-version   # bump package.json
#   git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
#
# Testing the packaging without publishing anything — do this before tagging
# whenever scripts/build-app.mjs or this file changed:
#
#   gh workflow run release.yml --ref <branch> -f dry_run=true
#
# A dry run builds both .dmg files on GitHub's Macs and keeps them as workflow
# artifacts. No tag, no Release, no npm.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and publish, e.g. v0.2.0 (leave empty for a dry run)'
        required: false
      dry_run:
        description: 'Build the .dmg files only and publish nothing'
        type: boolean
        default: false
      shell:
        description: 'Which Mac app: auto (a beta tag or a dry run → electron, a release tag → classic), electron, or classic'
        type: choice
        options: [auto, electron, classic]
        default: auto

permissions:
  contents: write

# The desktop build fetches its own Electron; npm's copy of the binary is not needed.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  mac:
    name: Mac app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # Built on a matching chip: the bundle ships one native module
          # (sharp, pulled in by Next) compiled for the machine that built it.
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Tag matches package.json
        if: ${{ !inputs.dry_run }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ver="$(node -p "require('./package.json').version")"
          if [ "${tag#v}" != "$ver" ]; then
            echo "::error::Tag $tag does not match package.json version $ver. Bump the version first."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # Which shell (docs/brain/DESKTOP.md): betas (v0.2.0-beta.1) and dry runs
      # build the Electron app; full releases stay classic until it is promoted.
      - name: Build the app and disk image
        run: |
          shell="${{ inputs.shell || 'auto' }}"
          if [ "$shell" = auto ]; then
            case "${{ inputs.tag || github.ref_name }}" in
              v*-*) shell=electron ;;
              v*)   shell=classic ;;
              *)    shell=electron ;;
            esac
          fi
          echo "Building the $shell app"
          echo "APP_SHELL=$shell" >> "$GITHUB_ENV"
          node scripts/build-app.mjs --shell="$shell"
        env:
          BUNDLE_ARCH: ${{ matrix.arch }}
      # The Electron app as people get it: installed from its own disk image by
      # install.sh, not the copy in dist/ (a link that only resolves on the build
      # machine passes there and fails everywhere else, TRAPS §37). Then open
      # it, reach it, refuse a second copy, quit it mid-job, and check that
      # nothing is left running.
      - name: Install it from the disk image, open, reach, quit, and check nothing is left
        if: env.APP_SHELL == 'electron'
        run: |
          set -u
          apps="$RUNNER_TEMP/apps"
          SIX_DEGREES_DMG="$(ls dist/*.dmg)" SIX_DEGREES_DEST="$apps" SIX_DEGREES_NO_OPEN=1 bash install.sh
          app="$apps/Six Degrees.app"
          codesign --verify --deep --strict "$app"
          if find "$app" -type l -exec readlink {} \; | grep -q '^/'; then echo "::error::The installed app has absolute symlinks"; exit 1; fi

          export SIX_DEGREES_HOME="$RUNNER_TEMP/six-degrees-home" SIX_DEGREES_SMOKE=1
          export SIX_DEGREES_SMOKE_SHOT="$RUNNER_TEMP/window-${{ matrix.arch }}.png"
          "$app/Contents/MacOS/Six Degrees" > "$RUNNER_TEMP/app.log" 2>&1 &
          app_pid=$!
          url=""
          for i in $(seq 1 120); do
            url=$(grep -o 'SIX_DEGREES_READY http://[0-9.:]*' "$RUNNER_TEMP/app.log" | awk '{print $2}' | tail -1)
            [ -n "$url" ] && break
            kill -0 $app_pid 2>/dev/null || { echo "::error::The app exited while starting"; cat "$RUNNER_TEMP/app.log"; exit 1; }
            sleep 1
          done
          [ -n "$url" ] || { echo "::error::The app never became ready"; cat "$RUNNER_TEMP/app.log"; exit 1; }
          echo "Running at $url"
          for p in "" paths queue setup api/network api/company-scores api/scraper; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/$p"); echo "  /$p $code"
            [ "$code" = 200 ] || exit 1
          done

          "$app/Contents/MacOS/Six Degrees" > "$RUNNER_TEMP/second.log" 2>&1 &
          second=$!
          for i in $(seq 1 20); do kill -0 $second 2>/dev/null || break; sleep 1; done
          if kill -0 $second 2>/dev/null; then echo "::error::A second copy kept running"; exit 1; fi
          echo "A second launch handed over and exited"

          # A job to stop: the scanner's setup (pip, no LinkedIn), uncached so it runs a while.
          server=$(lsof -nP -iTCP:"${url##*:}" -sTCP:LISTEN | awk 'NR==2{print $2}')
          curl -s -X POST -H 'Content-Type: application/json' -d '{"action":"install"}' "$url/api/scraper"; echo
          sleep 3
          jobs=$(pgrep -P "$server" | tr '\n' ' ')
          echo "job processes: ${jobs:-none}"
          kill -TERM $app_pid
          for i in $(seq 1 40); do kill -0 $app_pid 2>/dev/null || break; sleep 1; done
          if kill -0 $app_pid 2>/dev/null; then echo "::error::The app did not quit"; exit 1; fi
          sleep 2
          for j in $jobs; do if kill -0 "$j" 2>/dev/null; then echo "::error::Job $j was left running"; exit 1; fi; done
          if lsof -nP -iTCP:"${url##*:}" -sTCP:LISTEN; then echo "::error::The server was left running"; exit 1; fi
          if ps -axo command | grep -F "$app/Contents/" | grep -v grep; then echo "::error::App processes were left running"; exit 1; fi
          echo "Installed from the image, opened, reached, refused a second copy, quit mid-job, left nothing."
        env:
          PIP_NO_CACHE_DIR: '1'
      - uses: actions/upload-artifact@v4
        if: always() && env.APP_SHELL == 'electron'
        with:
          name: window-${{ matrix.arch }}
          path: ${{ runner.temp }}/window-*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: mac
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: out
      - name: Checksums
        working-directory: out
        run: sha256sum *.dmg > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # A tag with a hyphen (v0.2.0-beta.1) is a pre-release. install.sh and the
        # app's Updates panel follow releases/latest, which never returns one, so a
        # beta reaches only someone who asks for it by version (DESKTOP.md rule 4).
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber -R "$GITHUB_REPOSITORY"
          elif [ -n "$pre" ]; then
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --prerelease --title "$TAG (beta)" --notes "$(cat <<EOF
          **Beta.** Not offered to anyone automatically: the one-line install and the app's Updates panel skip pre-releases.

          To try it without touching your normal copy, install it to a separate folder:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/blakeb056/six-degrees/main/install.sh | SIX_DEGREES_VERSION=${TAG#v} SIX_DEGREES_DEST=~/Applications/Six-Degrees-Beta bash
          \`\`\`

          Your data is copied into ~/.six-degrees/backups/ before a new version first opens it.

          What changed: see CHANGELOG.md.
          EOF
          )"
          else
            gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --title "$TAG" --notes "$(cat <<'EOF'
          **Install on a Mac** — paste into Terminal:

          ```
          curl -fsSL https://raw.githubusercontent.com/blakeb056/six-degrees/main/install.sh | bash
          ```

          Or download the `.dmg` for your chip below (`arm64` = Apple Silicon, `x64` = Intel). The app is not signed with a paid Apple certificate, so a browser-downloaded copy needs a one-time **System Settings → Privacy & Security → Open Anyway**.

          Any system with Node 22.13+: `npx six-degrees@latest`

          What changed: see CHANGELOG.md.
          EOF
          )"
          fi

  npm:
    name: npm package
    needs: mac
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Publish (skipped until an NPM_TOKEN secret exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret — skipping npm publish."
            exit 0
          fi
          npm ci
          # A pre-release goes out under "next", never "latest", so `npx six-degrees`
          # keeps running the last full release.
          case "${{ inputs.tag || github.ref_name }}" in
            *-*) npm publish --provenance --access public --tag next ;;
            *)   npm publish --provenance --access public ;;
          esac
    permissions:
      contents: read
      id-token: write
